<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Sunny — Your Health Helper!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #e0f7fa 0%, #f0f4ff 50%, #fce4ec 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    color: #1a237e;
    text-align: center;
    margin-bottom: 4px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }
  .tagline {
    font-size: 1rem;
    color: #5c6bc0;
    text-align: center;
    margin-bottom: 20px;
  }

  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
    max-width: 540px;
  }

  /* ── ROBOT ── */
  .robot-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Speech bubble */
  .speech-bubble {
    background: #fff;
    border: 2.5px solid #5c6bc0;
    border-radius: 18px;
    padding: 12px 18px;
    max-width: 320px;
    font-size: 1rem;
    color: #1a237e;
    line-height: 1.5;
    text-align: center;
    position: relative;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(92,107,192,0.15);
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -16px;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #5c6bc0;
  }
  .speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: #fff;
    z-index: 1;
  }

  /* Typing dots */
  .typing-dots { display: none; gap: 5px; }
  .typing-dots span {
    width: 9px; height: 9px;
    background: #5c6bc0;
    border-radius: 50%;
    display: inline-block;
    animation: bounce 1s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }
  .typing-dots.show { display: flex; }

  /* Robot SVG */
  .robot-svg {
    width: 180px;
    margin-top: 14px;
    filter: drop-shadow(0 8px 18px rgba(92,107,192,0.3));
    transition: transform 0.3s;
  }
  .robot-svg.talking { animation: wobble 0.5s ease-in-out infinite alternate; }
  @keyframes wobble { from{transform:rotate(-2deg)} to{transform:rotate(2deg)} }

  /* Eyes blink */
  .eye { animation: blink 4s infinite; }
  .eye:nth-child(2) { animation-delay: 0.1s; }
  @keyframes blink {
    0%,90%,100%{ ry: 12; }
    95%{ ry: 2; }
  }

  /* Mouth */
  #mouth-happy { display: block; }
  #mouth-talk  { display: none; }
  .robot-svg.talking #mouth-happy { display: none; }
  .robot-svg.talking #mouth-talk  { display: block; }

  /* ── SUGGESTIONS ── */
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .sug-btn {
    background: #fff;
    border: 2px solid #5c6bc0;
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 0.85rem;
    color: #3949ab;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    font-weight: 500;
  }
  .sug-btn:hover { background: #e8eaf6; transform: scale(1.04); }

  /* ── INPUT ── */
  .input-area {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  .input-area input {
    flex: 1;
    border: 2.5px solid #5c6bc0;
    border-radius: 24px;
    padding: 12px 18px;
    font-size: 1rem;
    color: #1a237e;
    background: #fff;
    outline: none;
  }
  .input-area input:focus { border-color: #3949ab; box-shadow: 0 0 0 3px rgba(92,107,192,0.2); }
  .input-area button {
    background: #3949ab;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 12px 22px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .input-area button:hover { background: #283593; transform: scale(1.04); }
  .input-area button:disabled { background: #9fa8da; cursor: not-allowed; transform: none; }

  /* ── CHAT HISTORY ── */
  .history {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 260px;
    overflow-y: auto;
    padding: 4px 2px;
  }
  .msg-row { display: flex; gap: 8px; align-items: flex-end; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-bubble {
    max-width: 78%;
    padding: 10px 15px;
    border-radius: 16px;
    font-size: 0.92rem;
    line-height: 1.5;
  }
  .msg-row.user .msg-bubble  { background: #3949ab; color: #fff; border-bottom-right-radius: 4px; }
  .msg-row.bot  .msg-bubble  { background: #fff; color: #1a237e; border: 1.5px solid #c5cae9; border-bottom-left-radius: 4px; }
  .msg-icon { font-size: 1.4rem; }

  .footer { font-size: 0.75rem; color: #9fa8da; text-align: center; margin-top: 8px; }
</style>
</head>

  <div class="suggestions">
    <button class="sug-btn" onclick="ask('Why do we need to sleep?')">💤 Why do we sleep?</button>
    <button class="sug-btn" onclick="ask('Why should I eat vegetables?')">🥦 Why eat veggies?</button>
    <button class="sug-btn" onclick="ask('What happens when I get a cold?')">🤧 What is a cold?</button>
    <button class="sug-btn" onclick="ask('Why is exercise important?')">🏃 Why exercise?</button>
    <button class="sug-btn" onclick="ask('How does my heart work?')">❤️ My heart?</button>
    <button class="sug-btn" onclick="ask('Why do I need to drink water?')">💧 Why drink water?</button>
  </div>

  <!-- Input -->
  <div class="input-area">
    <input type="text" id="input" placeholder="Ask Dr. Sunny a health question..." onkeydown="if(event.key==='Enter')sendMsg()"/>
    <button id="send-btn" onclick="sendMsg()">Ask!</button>
  </div>

  <!-- Chat history -->
  <div class="history" id="history"></div>

  <p class="footer">Powered by AI · Precision Digital Health · Australian Science Week 2026</p>
</div>

<script>
const SYSTEM = `You are Dr. Sunny, a cheerful friendly health robot for primary school children aged 6–12 in Australia.
Rules:
- Use very simple, fun, easy words. Short sentences. Max 4 sentences per reply.
- Add 1–2 fun emojis.
- Only answer questions about health, the human body, food, sleep, exercise, hygiene, and feelings/wellbeing.
- If asked anything else, say "That's a great question, but I only know about health! Ask me about your body or staying healthy 😊"
- Never diagnose or give medical advice. For anything serious say "That sounds like something to ask your mum, dad, or doctor!"
- End with a fun health tip or encouraging line when you can.
- Use Australian English: mum not mom, biscuit not cookie, colour not color.
- Keep it positive and encouraging. Kids should feel happy after talking to you.`;

const history = [];
const robot = document.getElementById('robot');
const bubble = document.getElementById('bubble');
const bubbleText = document.getElementById('bubble-text');
const dots = document.getElementById('dots');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const historyEl = document.getElementById('history');

function addToHistory(role, text) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const icon = document.createElement('span');
  icon.className = 'msg-icon';
  icon.textContent = role === 'bot' ? '🤖' : '🧒';
  const bub = document.createElement('div');
  bub.className = 'msg-bubble';
  bub.textContent = text;
  if (role === 'user') { row.appendChild(bub); row.appendChild(icon); }
  else { row.appendChild(icon); row.appendChild(bub); }
  historyEl.appendChild(row);
  historyEl.scrollTop = historyEl.scrollHeight;
}

function setTalking(on) {
  robot.classList.toggle('talking', on);
}

function showTyping() {
  bubbleText.style.display = 'none';
  dots.classList.add('show');
  setTalking(true);
}

function showReply(text) {
  dots.classList.remove('show');
  bubbleText.style.display = '';
  bubbleText.textContent = text;
  setTalking(true);
  setTimeout(() => setTalking(false), 3000);
}

function ask(q) {
  input.value = q;
  sendMsg();
}

async function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addToHistory('user', text);
  history.push({ role: 'user', content: text });
  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 300,
        system: SYSTEM,
        messages: history
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || "Oops! I had a little glitch. Try asking again! 😊";
    showReply(reply);
    addToHistory('bot', reply);
    history.push({ role: 'assistant', content: reply });
  } catch(e) {
    showReply("Oops! Something went wrong. Try again! 😊");
  }
  sendBtn.disabled = false;
  input.focus();
}
</script>
