<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Robo — Precision Digital Health</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #e0f7fa 0%, #f0f4ff 50%, #fce4ec 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 2rem; color: #1a237e; text-align: center; margin-bottom: 4px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
  .tagline { font-size: 1rem; color: #5c6bc0; text-align: center; margin-bottom: 10px; }
  .main { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 540px; }
  .robot-wrap { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .speech-bubble {
    background: #fff; border: 2.5px solid #5c6bc0; border-radius: 18px;
    padding: 12px 18px; max-width: 320px; font-size: 1rem; color: #1a237e;
    line-height: 1.5; text-align: center; position: relative; min-height: 52px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(92,107,192,0.15);
  }
  .speech-bubble::after {
    content: ''; position: absolute; bottom: -16px; left: 50%;
    transform: translateX(-50%); border: 8px solid transparent; border-top-color: #5c6bc0;
  }
  .speech-bubble::before {
    content: ''; position: absolute; bottom: -12px; left: 50%;
    transform: translateX(-50%); border: 7px solid transparent; border-top-color: #fff; z-index: 1;
  }
  .typing-dots { display: none; gap: 5px; }
  .typing-dots span { width: 9px; height: 9px; background: #5c6bc0; border-radius: 50%; display: inline-block; animation: bounce 1s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }
  .typing-dots.show { display: flex; }

  /* Robot image — transparent background, no box */
  #robot {
    width: 210px;
    margin-top: 10px;
    filter: drop-shadow(0 6px 16px rgba(92,107,192,0.35));
    transition: transform 0.3s;
    background: transparent;
  }
  #robot.talking { animation: wobble 0.5s ease-in-out infinite alternate; }
  @keyframes wobble { from{transform:rotate(-3deg) scale(1.04)} to{transform:rotate(3deg) scale(1.04)} }

  /* New Chat button */
  .new-chat-btn {
    background: #3949ab; color: #fff; border: none; border-radius: 20px;
    padding: 8px 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 10px rgba(57,73,171,0.3);
    transition: background 0.15s, transform 0.1s; margin-bottom: 6px;
  }
  .new-chat-btn:hover { background: #283593; transform: scale(1.04); }

  /* Speaker toggle button */
  .speaker-btn {
    background: transparent; border: 2px solid #5c6bc0; border-radius: 20px;
    padding: 6px 14px; font-size: 0.82rem; color: #3949ab; cursor: pointer;
    transition: background 0.15s, transform 0.1s; margin-bottom: 6px; margin-left: 8px;
  }
  .speaker-btn:hover { background: #e8eaf6; }
  .speaker-btn.active { background: #3949ab; color: #fff; border-color: #3949ab; }

  .btn-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 4px; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sug-btn {
    background: #fff; border: 2px solid #5c6bc0; border-radius: 20px;
    padding: 7px 14px; font-size: 0.85rem; color: #3949ab; cursor: pointer;
    transition: background 0.15s, transform 0.1s; font-weight: 500;
  }
  .sug-btn:hover { background: #e8eaf6; transform: scale(1.04); }

  .input-area { display: flex; gap: 8px; width: 100%; }
  .input-area input {
    flex: 1; border: 2.5px solid #5c6bc0; border-radius: 24px;
    padding: 12px 18px; font-size: 1rem; color: #1a237e; background: #fff; outline: none;
  }
  .input-area input:focus { border-color: #3949ab; box-shadow: 0 0 0 3px rgba(92,107,192,0.2); }
  .input-area button {
    background: #3949ab; color: #fff; border: none; border-radius: 24px;
    padding: 12px 22px; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .input-area button:hover { background: #283593; transform: scale(1.04); }
  .input-area button:disabled { background: #9fa8da; cursor: not-allowed; transform: none; }

  .history { width: 100%; display: flex; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; padding: 4px 2px; }
  .msg-row { display: flex; gap: 8px; align-items: flex-end; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-bubble { max-width: 78%; padding: 10px 15px; border-radius: 16px; font-size: 0.92rem; line-height: 1.5; }
  .msg-row.user .msg-bubble { background: #3949ab; color: #fff; border-bottom-right-radius: 4px; }
  .msg-row.bot .msg-bubble { background: #fff; color: #1a237e; border: 1.5px solid #c5cae9; border-bottom-left-radius: 4px; }
  .msg-icon { font-size: 1.4rem; }
  .footer { font-size: 0.75rem; color: #9fa8da; text-align: center; margin-top: 8px; }
</style>
</head>

  <div class="suggestions">
    <button class="sug-btn" onclick="ask('Why do we need to sleep?')">💤 Why do we sleep?</button>
    <button class="sug-btn" onclick="ask('Why should I eat vegetables?')">🥦 Why eat veggies?</button>
    <button class="sug-btn" onclick="ask('What happens when I get a cold?')">🤧 What is a cold?</button>
    <button class="sug-btn" onclick="ask('Why is exercise important?')">🏃 Why exercise?</button>
    <button class="sug-btn" onclick="ask('How does my heart work?')">❤️ My heart?</button>
    <button class="sug-btn" onclick="ask('Why do I need to drink water?')">💧 Why drink water?</button>
  </div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Ask Dr. Robo a health question..." onkeydown="if(event.key==='Enter')sendMsg()"/>
    <button id="send-btn" onclick="sendMsg()">Ask!</button>
  </div>

  <div class="history" id="history"></div>
  <p class="footer">Powered by AI · Precision Digital Health · Australian Science Week 2026</p>
</div>

<script>
const SYSTEM = `You are Dr. Robo, a super fun and lovable health robot who is best friends with kids aged 6 to 12 in Australia.

HOW YOU TALK:
- Talk like you are EXCITED to chat with the child. Be warm, bubbly and enthusiastic!
- Always speak directly TO the child. Say "you" and "your".
- Use super simple words a 7-year-old would understand. Short, punchy sentences. Never more than 4 sentences.
- Make it fun! Use comparisons kids relate to like "your heart beats like a drum!" or "germs are like tiny invisible bugs!".
- Always end your reply by asking the child ONE fun follow-up question to keep them curious.
- Use 1 or 2 emojis per reply. Not too many.
- Be encouraging — make the child feel smart and proud for asking great questions!

WHAT YOU TALK ABOUT:
- Human body, health, food, nutrition, sleep, exercise, hygiene, feelings, emotions, staying safe.
- If asked anything else say: "Ooh great question! But I only know about health stuff — ask me about your body, food or feelings! 😊"

FOR ANYTHING SERIOUS like real pain or illness:
- Say: "That sounds really important — please tell your mum, dad or a doctor straight away! 💙"

NEVER diagnose. NEVER give medicine advice. ALWAYS be kind and encouraging.
Use Australian English: mum not mom, colour not color.`;

const history = [];
const robot = document.getElementById('robot');
const bubbleText = document.getElementById('bubble-text');
const dots = document.getElementById('dots');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const historyEl = document.getElementById('history');
const speakerBtn = document.getElementById('speakerBtn');

let voiceOn = true;
let speaking = false;

// ── Text-to-Speech ──
let selectedVoice = null;

function loadVoices() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  // Priority list — warm, friendly, female voices great for kids
  const priority = [
    'Google UK English Female',
    'Google Australian English',
    'Karen',        // macOS Australian
    'Samantha',     // macOS US — warm & clear
    'Moira',        // macOS Irish — warm
    'Fiona',        // macOS Scottish — energetic
    'Tessa',        // macOS South African
    'Victoria',     // macOS US
    'Allison',      // macOS US
    'Ava',          // macOS US — warm & young
    'Susan',
    'Google US English',
    'Microsoft Zira',
    'Microsoft Hazel',
  ];

  for (const name of priority) {
    const v = voices.find(v => v.name.includes(name));
    if (v) { selectedVoice = v; break; }
  }

  // Fallback: any en-AU, then any en-GB, then any en
  if (!selectedVoice) {
    selectedVoice = voices.find(v => v.lang === 'en-AU')
      || voices.find(v => v.lang === 'en-GB')
      || voices.find(v => v.lang.startsWith('en'));
  }
}

// Load voices immediately and also on voiceschanged
loadVoices();
window.speechSynthesis.onvoiceschanged = loadVoices;

function speak(text) {
  if (!voiceOn) return;
  window.speechSynthesis.cancel();

  // Strip emojis for cleaner speech
  const clean = text
    .replace(/[\u{1F300}-\u{1FFFF}]/gu, '')
    .replace(/[\u{2600}-\u{27BF}]/gu, '')
    .replace(/[\uFE00-\uFEFF]/gu, '')
    .trim();

  const utter = new SpeechSynthesisUtterance(clean);

  // Energetic 20s voice — bright, fun and natural
  utter.rate   = 0.95;   // Slightly under normal — clear but lively
  utter.pitch  = 1.2;    // Bright and upbeat — young adult energy
  utter.volume = 1.0;    // Full volume

  if (selectedVoice) utter.voice = selectedVoice;

  speaking = true;
  utter.onend   = () => { speaking = false; };
  utter.onerror = () => { speaking = false; };

  // Small delay so browser is ready
  setTimeout(() => window.speechSynthesis.speak(utter), 100);
}

function toggleSpeaker() {
  voiceOn = !voiceOn;
  if (!voiceOn) {
    window.speechSynthesis.cancel();
    speakerBtn.textContent = '🔇 Voice Off';
    speakerBtn.classList.remove('active');
  } else {
    speakerBtn.textContent = '🔊 Voice On';
    speakerBtn.classList.add('active');
  }
}



function addToHistory(role, text) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const icon = document.createElement('span');
  icon.className = 'msg-icon';
  icon.textContent = role === 'bot' ? '🤖' : '🧒';
  const bub = document.createElement('div');
  bub.className = 'msg-bubble';
  bub.textContent = text;
  if (role === 'user') { row.appendChild(bub); row.appendChild(icon); }
  else { row.appendChild(icon); row.appendChild(bub); }
  historyEl.appendChild(row);
  historyEl.scrollTop = historyEl.scrollHeight;
}

function setTalking(on) { robot.classList.toggle('talking', on); }

function showTyping() {
  bubbleText.style.display = 'none';
  dots.classList.add('show');
  setTalking(true);
}

function showReply(text) {
  dots.classList.remove('show');
  bubbleText.style.display = '';
  bubbleText.textContent = text;
  setTalking(true);
  speak(text);
  setTimeout(() => setTalking(false), 3500);
}

function ask(q) { input.value = q; sendMsg(); }

function newChat() {
  history.length = 0;
  historyEl.innerHTML = '';
  window.speechSynthesis.cancel();
  const msg = "G'day! I'm Dr. Robo! Ask me anything about staying healthy! 😊";
  showReply(msg);
  setTimeout(() => setTalking(false), 2000);
  input.value = '';
  input.focus();
}

async function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addToHistory('user', text);
  history.push({ role: 'user', content: text });
  showTyping();
  window.speechSynthesis.cancel();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': 'YOUR_API_KEY_HERE',
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-allow-browser': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 300,
        system: SYSTEM,
        messages: history
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || "Oops! I had a little glitch. Try asking me again 😊";
    showReply(reply);
    addToHistory('bot', reply);
    history.push({ role: 'assistant', content: reply });
  } catch(e) {
    const err = "Oops! Something went wrong. Try again! 😊";
    showReply(err);
  }
  sendBtn.disabled = false;
  input.focus();
}
</script>
